<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Warga | SiapSiaga</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #626F47;
            padding: 25px 40px;
            width: 100%;
        }

        header h1 {
            color: #F5ECD5;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 0;
        }

        .reports-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .report-card {
            background-color: #F5ECD5;
            border-radius: 12px;
            padding: 24px;
            position: relative;
            min-height: 170px;
        }

        .report-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #626F47;
            margin-bottom: 15px;
            padding-right: 150px;
        }

        .report-details {
            display: grid;
            grid-template-columns: 120px 1fr;
            row-gap: 4px;
            column-gap: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .report-details .label {
            font-weight: 700;
            color: #555555;
        }

        .report-details .value {
            color: #666666;
            overflow-wrap: anywhere;
        }

        .badge-status {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .status-resmi {
            color: #299B35;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            background-color: #626F47;
            color: #ffffff;
            border: none;
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #4F5A39;
        }

        nav.bottom-nav {
            background-color: #F5ECD5;
            border-top: 1px solid #e0d7c3;
            padding: 15px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            color: #626F47;
            font-size: 2rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-item:hover {
            color: #3f4a30;
        }

        .nav-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            main {
                padding: 25px 18px 100px;
            }

            .top-bar {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }

            .page-title {
                font-size: 1.4rem;
            }

            .filter-select {
                width: 100%;
            }

            .report-card {
                padding: 20px;
            }

            .report-title {
                font-size: 1.35rem;
                padding-right: 0;
                margin-bottom: 12px;
            }

            .badge-status {
                position: static;
                margin-bottom: 12px;
            }

            .badge-bencana-baru {
                position: static;
                transform: none;
                flex-direction: row;
                justify-content: flex-start;
                gap: 7px;
            }

            .badge-bencana-baru .alert-icon {
                width: 25px;
                height: 25px;
            }

            .report-details {
                grid-template-columns: 85px 1fr;
                font-size: 0.85rem;
                column-gap: 10px;
            }

            .action-buttons {
                gap: 8px;
            }

            .btn-action {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>

    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>SiapSiaga</h1>
    </header>

    <main>

        <div class="top-bar">
            <h2 class="page-title">Laporan Warga Terverifikasi</h2>
        </div>
        <div class="reports-list" id="reportsList">

            <div class="report-card" th:each="laporan : ${daftarLaporan}" data-status="Resmi">

                <div class="badge-status status-resmi">Terverifikasi</div>

                <h3 class="report-title" th:text="${laporan.jenisBencana}">Jenis Bencana</h3>

                <div class="report-details">
                    <span class="label">Lokasi</span>
                    <span class="value" th:text="${laporan.lokasi ?: '-'}">-</span>

                    <span class="label">Tanggal</span>
                    <span class="value" th:text="${laporan.tanggal != null ? #temporals.format(laporan.tanggal, 'dd MMMM yyyy') : '-'}">-</span>

                    <span class="label">Jam</span>
                    <span class="value" th:text="${laporan.waktu != null ? #temporals.format(laporan.waktu, 'HH.mm') : '-'}">-</span>

                    <span class="label">Catatan</span>
                    <span class="value" th:text="${laporan.catatan ?: '-'}">-</span>
                </div>

                <div class="action-buttons">
                    <a th:href="@{/laporan/detail/{id}(id=${laporan.id})}" href="detailBencanaAdmin.html" class="btn-action">
                        Lihat Detail
                    </a>
                </div>

            </div>

             <div class="report-card" th:each="laporan : ${daftarLaporan}" data-status="Resmi">

                <div class="badge-status status-resmi">Terverifikasi</div>

                <h3 class="report-title" th:text="${laporan.jenisBencana}">Jenis Bencana</h3>

                <div class="report-details">
                    <span class="label">Lokasi</span>
                    <span class="value" th:text="${laporan.lokasi ?: '-'}">-</span>

                    <span class="label">Tanggal</span>
                    <span class="value" th:text="${laporan.tanggal != null ? #temporals.format(laporan.tanggal, 'dd MMMM yyyy') : '-'}">-</span>

                    <span class="label">Jam</span>
                    <span class="value" th:text="${laporan.waktu != null ? #temporals.format(laporan.waktu, 'HH.mm') : '-'}">-</span>

                    <span class="label">Catatan</span>
                    <span class="value" th:text="${laporan.catatan ?: '-'}">-</span>
                </div>

                <div class="action-buttons">
                    <a th:href="@{/laporan/detail/{id}(id=${laporan.id})}" href="detailBencanaAdmin.html" class="btn-action">
                        Lihat Detail
                    </a>
                </div>

            </div>
        </div>
    </main>

   <nav class="bottom-nav">
            <a th:href="@{/admin/dashboard}" class="nav-item">
                <img src="../assets/home-black.png" alt="Beranda" class="nav-icon">
            </a>

             <a th:href="@{/admin/laporan-warga}"  class="nav-item">
                <img src="../assets/report-green.png" alt="Laporan" class="nav-icon">
            </a>

            <a th:href="@{/admin/import-data}" class="nav-item">
                <img src="../assets/importData-black.png" alt="Import" class="nav-icon">
            </a>

            <a th:href="@{/admin/profil}" class="nav-item">
                <img src="../assets/profile-black.png" alt="Profil" class="nav-icon">
            </a>
    </nav>
</body>
</html>
