
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Petugas SiapSiaga</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #626F47;
            padding: 25px 40px;
            width: 100%;
        }

        header h1 {
            color: #F5ECD5;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Konten */
        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 15px;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000;
        }

        .btn-back {
            color: #000000;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .btn-back img {
            width: 20px;
            height: 20px;
        }

        .form-container {
            background-color: #F5ECD5;
            border-radius: 12px;
            padding: 35px;
            margin: 10px auto 0;
            min-height: 550px;
            width: 75%;
            max-width: 850px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petugas-form {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 25px;
            object-fit: contain;
        }

        .form-group {
            width: 100%;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .form-group label {
            width: 100%;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            color: #666666;
        }

        .form-control {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333333;
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #626F47;
        }

        .btn-submit {
            background-color: #626F47;
            color: #ffffff;
            border: none;
            padding: 11px 25px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #4F5A39;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            main {
                padding: 25px 18px 100px;
            }

            .top-bar {
                align-items: center;
                gap: 10px;
            }

            .page-title {
                font-size: 1.4rem;
            }

            .form-container {
                padding: 30px 20px;
                min-height: 450px;
                width: 100%;
            }

            .petugas-form {
                max-width: 100%;
            }

            .btn-submit {
                width: 100%;
            }
            .profile-icon {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>SiapSiaga</h1>
    </header>

    <main>

        <div class="top-bar">

            <div class="page-title">
                <a th:href="@{/admin/data-petugas}"
                   href="dataPetugas.html"
                   class="btn-back">
                    <img src="../assets/back-black.png" alt="Kembali">
                </a>

                <h3>Tambah Petugas</h3>
            </div>

        </div>

        <div class="form-container">

            <form class="petugas-form"
                th:action="@{/admin/data-petugas/edit}"
                method="post">

                <img src="../assets/profile-black.png" alt="Profile" class="profile-icon">
                <div class="form-group">
                    <label for="nik">NIK</label>

                    <input type="text"
                        id="nik"
                        name="nik"
                        class="form-control"
                        value="61823010385485682"
                        readonly>
                </div>

                <!-- Nama Lengkap -->
                <div class="form-group">
                    <label for="namaPetugas">Nama Lengkap</label>

                    <input type="text"
                        id="namaPetugas"
                        name="namaPetugas"
                        class="form-control"
                        placeholder="Masukkan Nama Lengkap"
                        required>
                </div>

                <!-- Kota Saat Ini -->
                <div class="form-group">
                    <label for="kotaLokasiKerja">Kota Saat Ini</label>

                    <select id="kotaLokasiKerja"
                            name="kotaLokasiKerja"
                            class="form-control"
                            required>

                        <option value="" disabled selected>Pilih Kota</option>
                        <option value="Bandung">Bandung</option>
                        <option value="Jakarta">Jakarta</option>
                        <option value="Semarang">Semarang</option>
                        <option value="Lampung">Lampung</option>
                        <option value="Bali">Bali</option>

                    </select>
                </div>

                <button type="submit" class="btn-submit">
                    Tambah Petugas
                </button>

            </form>
        </div>

    </main>

</body>
</html>
