
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Petugas SiapSiaga</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #626F47;
            padding: 25px 40px;
            width: 100%;
        }

        header h1 {
            color: #F5ECD5;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Konten */
        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 15px;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000;
        }

        .btn-back {
            color: #000000;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .btn-back img {
            width: 20px;
            height: 20px;
        }

        .form-container {
            background-color: #F5ECD5;
            border-radius: 12px;
            padding: 35px;
            margin: 10px auto 0;
            min-height: 550px;
            width: 75%;
            max-width: 850px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petugas-form {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Icon Profil */
        .profile-icon {
            width: 170px;
            height: 170px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        /* Form Group */
        .form-group {
            width: 100%;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .form-group label {
            width: 100%;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            color: #666666;
        }

        .form-control {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333333;
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #626F47;
        }

        .form-control:read-only {
            background-color: #e9e9e9;
            cursor: not-allowed;
        }

        select.form-control {
            background-color: #ffffff !important;
            color: #333333 !important;
            opacity: 1;
            appearance: auto;
            -webkit-appearance: auto;
        }

        select.form-control option {
            background-color: #ffffff;
            color: #333333;
        }

        select.form-control:hover {
            cursor: pointer;
        }

        select.form-control:disabled {
            cursor: not-allowed;
        }

        .form-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: 15px;
        }

        .btn-delete {
            background-color: #D9534F;
            border: none;
            border-radius: 8px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-delete img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .btn-delete:hover {
            background-color: #C9302C;
        }

        .btn-submit {
            background-color: #626F47;
            color: #ffffff;
            border: none;
            padding: 11px 25px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0;
        }

        .btn-submit:hover {
            background-color: #4F5A39;
        }


        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background-color: #ffffff;
            width: 90%;
            max-width: 450px;
            padding: 35px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333333;
            margin-bottom: 18px;
        }

        .modal-content p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 28px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .modal-buttons button {
            padding: 11px 25px;
            border: none;
            border-radius: 7px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-cancel {
            background-color: #D9D9D9;
            color: #333333;
        }

        .btn-cancel:hover {
            background-color: #C5C5C5;
        }

        .btn-confirm-save {
            background-color: #626F47;
            color: #ffffff;
        }

        .btn-confirm-save:hover {
            background-color: #4F5A39;
        }

        .btn-confirm-delete {
            background-color: #D9534F;
            color: #ffffff;
        }

        .btn-confirm-delete:hover {
            background-color: #C9302C;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .modal-content {
                padding: 30px 20px;
            }

            .modal-buttons button {
                padding: 10px 18px;
            }
        }
        /* Responsive */
        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            main {
                padding: 25px 18px 100px;
            }

            .top-bar {
                align-items: center;
                gap: 10px;
            }

            .page-title {
                font-size: 1.4rem;
            }

            .form-container {
                padding: 30px 20px;
                min-height: 450px;
                width: 100%;
            }

            .petugas-form {
                max-width: 100%;
            }

            .profile-icon {
                width: 140px;
                height: 140px;
            }

            .btn-submit {
                width: 100%;
            }
        }
    </style>
</head>


<div class="modal-overlay" id="saveModal">

    <div class="modal-content">

        <h2>Simpan Perubahan</h2>

        <p>
            Apakah Anda yakin ingin menyimpan perubahan data petugas ini?
        </p>

        <div class="modal-buttons">
            <button type="button"
                    class="btn-cancel"
                    onclick="closeSaveModal()">
                Batalkan
            </button>

            <button type="button"
                    class="btn-confirm-save"
                    onclick="confirmSave()">
                Simpan
            </button>
        </div>

    </div>

</div>


<div class="modal-overlay" id="deleteModal">

    <div class="modal-content">

        <h2>Konfirmasi Hapus</h2>

        <p>
            Yakin ingin menghapus data petugas berikut?
            Data yang dihapus tidak dapat dikembalikan.
        </p>

        <div class="modal-buttons">
            <button type="button"
                    class="btn-cancel"
                    onclick="closeDeleteModal()">
                Batalkan
            </button>

            <button type="button"
                    class="btn-confirm-delete"
                    onclick="confirmDelete()">
                Hapus
            </button>
        </div>

    </div>

</div>


<script>
    // Pop-up Simpan
    function openSaveModal() {
        document.getElementById("saveModal").style.display = "flex";
    }

    function closeSaveModal() {
        document.getElementById("saveModal").style.display = "none";
    }

    function confirmSave() {
        document.getElementById("editForm").submit();
    }


    // Pop-up Hapus
    function openDeleteModal() {
        document.getElementById("deleteModal").style.display = "flex";
    }

    function closeDeleteModal() {
        document.getElementById("deleteModal").style.display = "none";
    }

    function confirmDelete() {
        document.getElementById("deleteForm").submit();
    }
</script>


<body>

    <header>
        <h1>SiapSiaga</h1>
    </header>

    <main>

        <div class="top-bar">

            <div class="page-title">
                <a th:href="@{/admin/data-petugas}"
                   href="dataPetugas.html"
                   class="btn-back">
                    <img th:src="@{/assets/back-black.png}"
                         src="../assets/back-black.png"
                         alt="Kembali">
                </a>

                <h3>Edit Petugas</h3>
            </div>

        </div>

        <div class="form-container">

            <div class="petugas-form">

                <form id="editForm" th:object="${petugas}"
                    th:action="@{/admin/data-petugas/edit/{id}(id=${petugas.nik})}"
                    method="post"
                    class="petugas-form">

                    <img th:src="@{/assets/profile-black.png}"
                        alt="Profile"
                        class="profile-icon">
                    
                        <div class="form-group">
                            <label for="nik">NIK</label>
                            <input type="text"
                                id="nik"
                                th:field="*{nik}"
                                class="form-control"
                                readonly> 
                        </div>

                    <div class="form-group">
                        <label for="namaPetugas">Nama Lengkap</label>
                        <input type="text"
                            id="namaPetugas"
                            th:field="*{nama_lengkap}"
                            class="form-control"
                            placeholder="Masukkan Nama Lengkap"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="kotaLokasiKerja">Kota Saat Ini</label>
                        <select id="kotaLokasiKerja"
                                th:field="*{kota_kerja}"
                                class="form-control"
                                required>
                            <option value="" disabled selected>Pilih Kota</option>
                            <option value="Bandung">Bandung</option>
                            <option value="Jakarta">Jakarta</option>
                            <option value="Semarang">Semarang</option>
                            <option value="Lampung">Lampung</option>
                            <option value="Bali">Bali</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="text"
                            id="password"
                            th:field="*{password}"
                            class="form-control"
                            required> 
                    </div>

                    <div class="form-buttons">
                        <button type="button"
                                class="btn-delete"
                                onclick="openDeleteModal()">
                            <img th:src="@{/assets/delete_icon.png}"
                                alt="Hapus">
                        </button>

                        <button type="button"
                                class="btn-submit"
                                onclick="openSaveModal()">
                            Simpan Perubahan
                        </button>
                    </div>

                </form>

                <form id="deleteForm"
                    th:action="@{/admin/data-petugas/hapus/{nik}(nik=${petugas.nik})}"
                    method="post">
                </form>

            </div>
        </div>

    </main>

</body>
</html>
