
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Petugas SiapSiaga</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #626F47;
            padding: 25px 40px;
            width: 100%;
        }

        header h1 {
            color: #F5ECD5;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Konten */
        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 15px;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000;
        }

        .btn-back {
            color: #000000;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .btn-back svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Tombol Tambah */
        .btn-add {
            background-color: #A5B66A;
            color: #000000;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: #91A257;
        }

        /* Tabel */
        .table-container {
            background-color: #F5ECD5;
            border-radius: 12px;
            padding: 48px 40px;
            margin-top: 10px;
            overflow-x: auto;
            min-height: 255px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petugas-table {
            width: 85%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
        }

        .petugas-table th {
            background-color: #626F47;
            color: #ffffff;
            font-weight: 600;
            padding: 10px 12px;
            border: 1px solid #ffffff;
        }

        .petugas-table td {
            background-color: #C9D09A;
            color: #000000;
            padding: 10px 12px;
            border: 1px solid #ffffff;
            font-weight: 500;
        }

        .petugas-table th:first-child,
        .petugas-table td:first-child {
            width: 10%;
        }

        .petugas-table th:last-child,
        .petugas-table td:last-child {
            width: 10%;
        }

        .btn-edit {
            color: #000000;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-edit svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .btn-edit:hover {
            color: #626F47;
        }

        .empty-state {
            color: #666666;
            font-size: 0.95rem;
            text-align: center;
            padding: 20px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            main {
                padding: 25px 18px 100px;
            }

            .top-bar {
                align-items: center;
                gap: 10px;
            }

            .page-title {
                font-size: 1.4rem;
            }

            .btn-add {
                padding: 8px 12px;
                font-size: 0.8rem;
            }

            .table-container {
                padding: 30px 15px;
                min-height: 220px;
                justify-content: flex-start;
            }

            .petugas-table {
                width: 100%;
                min-width: 450px;
                font-size: 0.75rem;
            }

            .petugas-table th,
            .petugas-table td {
                padding: 9px 8px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>SiapSiaga</h1>
    </header>

    <main>

        <div class="top-bar">

            <div class="page-title">
                <a th:href="@{/admin/manajemen-data}" href="importData.html" class="btn-back">
                    <img src="../assets/back-black.png" alt="">
                </a>

                <h3>Data Petugas</h3>
            </div>

            <a th:href="@{/admin/data-petugas/tambah}"
               href="tambahPetugas.html"
               class="btn-add">
                Tambah Petugas
            </a>

        </div>

        <div class="table-container">

            <table class="petugas-table">

                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Petugas</th>
                        <th>Kota Lokasi Kerja</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="petugas, iterStat : ${daftarPetugas}">
                        <td th:text="${iterStat.count}">1</td>

                        <td th:text="${petugas.namaPetugas}">
                            Andi Pratama
                        </td>

                        <td th:text="${petugas.kotaLokasiKerja}">
                            Bandung
                        </td>

                        <td>
                            <a th:href="@{/admin/data-petugas/edit/{id}(id=${petugas.id})}"
                               href="editPetugas.html"
                               class="btn-edit"
                               title="Edit Petugas">
                               <!-- GANTI EDIT TOMBOL -->
                                <svg viewBox="0 0 24 24">
                                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/>
                                </svg>
                            </a>
                        </td>
                    </tr>

                    <tr th:each="petugas, iterStat : ${daftarPetugas}">
                        <td th:text="${iterStat.count}">2</td>

                        <td th:text="${petugas.namaPetugas}">
                            Siti Rahmawati
                        </td>

                        <td th:text="${petugas.kotaLokasiKerja}">
                            Semarang
                        </td>

                        <td>
                            <a th:href="@{/admin/data-petugas/edit/{id}(id=${petugas.id})}"
                               href="editPetugas.html"
                               class="btn-edit"
                               title="Edit Petugas">
                               <!-- GANTI EDIT TOMBOL -->
                                <svg viewBox="0 0 24 24">
                                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/>
                                </svg>
                            </a>
                        </td>
                    </tr>
                    
                </tbody>

            </table>

        </div>

    </main>

</body>
</html>
