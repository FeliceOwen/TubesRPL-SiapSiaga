<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profil Petugas | SiapSiaga</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }

            body {
                background-color: #ffffff;
                color: #333;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            header {
                top: 0;
                position: sticky;
                z-index: 1000;
                width: 100%;
                background-color: #626F47;
                color: #F5ECD5;
                padding: 16px 28px;
                font-weight: bold;
                font-size: 26px;
            }

            main {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
            }

            .avatar {
                width: 110px;
                margin-bottom: 15px;
            }

            #role {
                font-size: 1.5rem;
                font-weight: 800;
                color: #626F47;
                margin-bottom: 25px;
            }

            #biodata {
                display: flex;
                flex-direction: column;
                gap: 14px;
                width: 100%;
                max-width: 340px;
                background-color: #626F47;
                border-radius: 10px;
                padding: 20px;
                color: white;
            }

            #biodata label {
                display: block;
                font-size: 13px;
                font-weight: bold;
                color: #F5ECD5;
                margin-bottom: 2px;
            }

            #biodata p {
                font-size: 18px;
                font-weight: 600;
                word-break: break-word;
            }

            #logout {
                margin-top: 25px;
                padding: 10px 40px;
                border-radius: 10px;
                background-color: #F5ECD5;
                color: #626F47;
                border: 2px solid #626F47;
                font-weight: bold;
                font-size: 16px;
                text-decoration: none;
            }

            nav.bottom-nav {
                background-color: #F5ECD5;
                border-top: 1px solid #e0d7c3;
                padding: 15px 0;
                display: flex;
                justify-content: space-around;
                align-items: center;
            }

            .nav-icon {
                width: 32px;
                height: 32px;
                object-fit: contain;
            }

            .nav-item:hover {
                color: #3f4a30;
            }
        </style>
    </head>
    <body>
        <header>
            SiapSiaga
        </header>

        <main>
            <img class="avatar" src="../assets/profile-black.png" th:src="@{/assets/profile-black.png}" alt="Profil">
            <h2 id="role" th:text="${role}">Petugas</h2>
            <div id="biodata">
                <div>
                    <label>NIK</label>
                    <p th:text="${nik}">NIK Petugas</p>
                </div>
                <div>
                    <label>Nama</label>
                    <p th:text="${nama}">Nama Petugas</p>
                </div>
            </div>
            <a id="logout" href="#" th:href="@{/logout}">Logout</a>
        </main>

        <nav class="bottom-nav">
            <a th:href="@{/petugas/dashboard}" href="DashboardPetugas.html" class="nav-item">
                <img src="../assets/home-black.png" th:src="@{/assets/home-black.png}" alt="Beranda" class="nav-icon">
            </a>

            <a th:href="@{/laporan-warga}" href="LaporanWarga.html" class="nav-item">
                <img src="../assets/report-black.png" th:src="@{/assets/report-black.png}" alt="Laporan" class="nav-icon">
            </a>

            <a th:href="@{/petugas/profil}" href="ProfilPetugas.html" class="nav-item">
                <img src="../assets/profile-green.png" th:src="@{/assets/profile-green.png}" alt="Profil" class="nav-icon">
            </a>
        </nav>
    </body>
</html>
