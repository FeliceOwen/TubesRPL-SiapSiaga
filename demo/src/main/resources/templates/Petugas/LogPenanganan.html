<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Log Penanganan | SiapSiaga</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            top: 0;
            position: sticky;
            z-index: 1000;
            width: 100%;
            background-color: #626F47;
            color: #F5ECD5;
            padding: 16px 28px;
            font-weight: bold;
            font-size: 26px;
        }

        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title-container {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000000;
            transition: opacity 0.2s;
        }

        .btn-back:hover {
            opacity: 0.7;
        }

        .btn-back-image {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: block;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #000000;
        }

        .form-card {
            background-color: #F5ECD5;
            border-radius: 16px;
            padding: 36px 44px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 200px 260px;
            align-items: center;
            gap: 16px;
        }

        .form-group.top-aligned {
            align-items: flex-start;
        }

        .form-group label {
            font-size: 1.05rem;
            color: #555555;
            font-weight: 500;
        }

        .input-control {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid #C8C2B0;
            border-radius: 8px;
            background-color: #ffffff;
            font-size: 0.9rem;
            color: #333333;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: #626F47;
        }

        textarea.input-control {
            min-height: 95px;
            padding: 10px 14px;
            resize: none;
            font-family: inherit;
        }

        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-input-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #C8C2B0;
            border-radius: 10px;
            background-color: #ffffff;
            font-size: 0.85rem;
            color: #000000;
            cursor: pointer;
        }

        .file-input-control::file-selector-button {
            background-color: #D9D9D9;
            color: #000000;
            border: 1px solid #B5B5B5;
            border-radius: 4px;
            padding: 4px 10px;
            margin-right: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .file-input-control::file-selector-button:hover {
            background-color: #CCCCCC;
        }

        .file-hint {
            font-size: 0.85rem;
            color: #111111;
            font-weight: 10px;
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-submit {
            background-color: #626F47;
            color: #ffffff;
            border: none;
            padding: 12px 36px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #4F5A39;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        @media (max-width: 700px) {
            main {
                padding: 25px 18px;
            }

            .form-card {
                padding: 24px 20px;
            }

            .form-group {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .btn-submit {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        SiapSiaga
    </header>

    <main>
        <div class="page-title-container">
            <a th:href="${laporan != null and !#strings.isEmpty(laporan.id_laporan)} ? @{/laporan/detail/{id}(id=${laporan.id_laporan})} : @{/laporan-warga}"
                href="DetailBencana.html"
                class="btn-back"
                title="Kembali">
                <img th:src="@{/assets/back-black.png}" src="../assets/back-black.png" alt="Kembali" class="btn-back-image">
            </a>
            <h2 class="page-title">Tambah Log Penanganan</h2>
        </div>

        <form class="form-card"
            th:action="${laporanId != null ? '/penanganan/simpan/' + laporanId : '#'}" 
            method="POST" 
            enctype="multipart/form-data">

            <div class="form-group">
                <label for="badan_penanganan">Badan Penanganan</label>
                <input type="text" id="badan_penanganan" name="badanPenanganan" class="input-control" placeholder="Contoh: BNPB Jawa Barat"
                required>
            </div>

            <div class="form-group">
                <label for="total_personel">Total Personel</label>
                <input type="number" id="total_personel" name="jumlahPersonel" class="input-control" min="1" placeholder="Jumlah personel"
                required>
            </div>

            <div class="form-group">
                <label for="tanggal_penanganan">Tanggal Penanganan</label>
                <input type="date" id="tanggal_penanganan" name="tanggal" class="input-control" placeholder="Jumlah personel"
                required>
            </div>

            <div class="form-group top-aligned">
                <label for="aktivitas">Aktivitas</label>
                <textarea id="aktivitas" name="aktivitas" class="input-control" placeholder="Isi aktivitas yang dilakukan"
                required></textarea>
            </div>

            <div class="form-group top-aligned">
                <label for="foto-penanganan">Foto Penanganan</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="foto_penanganan" name="fotoPenanganan" class="file-input-control" accept=".jpg,.jpeg,.png">
                <span class="file-hint">Format file yang didukung: .jpg, .jpeg, .png</span>
                </div>
            </div>

            <div class="action-container">
                <button type="submit" class="btn-submit">Tambah Penanganan</button>
            </div>
        </form>
    </main>
</body>
</html>
