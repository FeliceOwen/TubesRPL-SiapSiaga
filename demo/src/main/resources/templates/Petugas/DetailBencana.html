<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Bencana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: white;
        }

        header {
            background-color: #626F47;
            color: #F5ECD5;
            padding: 16px 28px;
            font-weight: bold;
            font-size: 26px;
        }

        main {
            padding: 20px 32px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .back {
            margin-bottom: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .back a {
            text-decoration: none;
            color: black;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .container {
            background-color: #F5ECD5;
            border-radius: 10px;
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 32px;
        }

        /* Bagian kiri */
        .detail {
            flex: 1;
        }

        .judul {
            color: #626F47;
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 18px;
        }

        .informasi {
            display: grid;
            grid-template-columns: 140px 1fr;
            row-gap: 6px;
            font-size: 13px;
            color: #626262;
        }

        .informasi .label {
            font-weight: bold;
        }

        .foto {
            margin-top: 18px;
        }

        .foto p {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
            color: #626262;
        }

        .foto img {
            width: 210px;
            height: 125px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        .empty-img-box {
            width: 210px;
            height: 125px;
            background-color: #e5dcc5;
            border: 1px dashed #b5ad96;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #626262;
            font-size: 13px;
        }

        /* Bagian kanan */
        .penanganan {
            width: 440px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Form Update Status di Pojok Kanan Atas */
        .status-form {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 28px;
        }

        .status-select {
            width: 200px;
            padding: 7px 12px;
            border: 1px solid #333333;
            border-radius: 6px;
            background-color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            color: #000000;
            outline: none;
            cursor: pointer;
        }

        .btn-simpan {
            background-color: #626F47;
            color: #ffffff;
            border: none;
            padding: 6px 32px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-simpan:hover {
            background-color: #4f5a39;
        }

        /* Header Log Penanganan + Tombol Tambah */
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 12px;
        }

        .log-header h2 {
            font-size: 19px;
            font-weight: 800;
            margin: 0;
            color: #000000;
        }

        .btn-tambah {
            background-color: #626F47;
            color: #ffffff;
            text-decoration: none;
            padding: 6px 20px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-tambah:hover {
            background-color: #4f5a39;
        }

        .btn-tambah.disabled {
            background-color: #A0A0A0;
            color: #EAEAEA;
            pointer-events: none;
            cursor: not-allowed;
        }

        .log {
            background-color: #626F47;
            color: white;
            padding: 18px 20px;
            border-radius: 8px;
            font-size: 12px;
            width: 100%;
        }

        .log-info {
            display: grid;
            grid-template-columns: 135px 1fr;
            row-gap: 6px;
        }

        .log-info .label {
            font-weight: bold;
        }

        .foto-penanganan {
            margin-top: 14px;
        }

        .foto-penanganan p {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .foto-penanganan img {
            width: 210px;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        .empty-img-box-dark {
            width: 210px;
            height: 110px;
            background-color: #54603c;
            border: 1px dashed #8c9970;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e6d3;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 820px) {
            .container {
                flex-direction: column;
            }

            .penanganan {
                width: 100%;
            }

            .status-form {
                align-items: flex-start;
                margin-bottom: 20px;
            }

            .status-select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>SiapSiaga</header>

    <main>

        <div class="back">
            <a th:href="@{/laporan-warga}">
                <img th:src="@{/assets/back-black.png}" alt="Kembali">
                Detail
            </a>
        </div>

        <div class="container">

            <!-- Bagian Kiri -->
            <section class="detail">

                <h2 class="judul" th:text="${laporan.id_bencana?.nama_bencana ?: '-'}">-</h2>

                <div class="informasi">
                    <div class="label">Jenis Bencana</div>
                    <div th:text="${laporan.id_bencana?.nama_bencana ?: '-'}">-</div>

                    <div class="label">Tanggal Kejadian</div>
                    <div th:text="${laporan.tanggalKejadian != null ? #temporals.format(laporan.tanggalKejadian, 'dd MMMM yyyy') : '-'}">-</div>

                    <div class="label">Waktu Kejadian</div>
                    <div th:text="${laporan.jamKejadian != null ? #temporals.format(laporan.jamKejadian, 'HH.mm') : '-'}">-</div>

                    <div style="height: 8px;"></div>
                    <div style="height: 8px;"></div>

                    <div class="label">Kelurahan</div>
                    <div th:text="${lokasiLengkap ?: (laporan.id_kel ?: '-')}">-</div>

                    <div class="label">Sekolah</div>
                    <div th:text="${laporan.id_sekolah?.nama_sekolah ?: '-'}">-</div>

                    <div class="label">Catatan / Detail</div>
                    <div th:text="${laporan.catatan ?: '-'}">-</div>

                    <div class="label">Status Saat Ini</div>
                    <div style="font-weight: 700; color: #626F47;" th:text="${laporan.id_status?.status_verifikasi ?: '-'}">-</div>
                </div>

                <div class="foto">
                    <p>Foto Kejadian</p>
                    <img th:if="${laporan.foto != null}" 
                         th:src="@{/laporan/foto/{id}(id=${laporan.id_laporan})}"
                         alt="Foto Kejadian">
                    <div th:if="${laporan.foto == null}" class="empty-img-box">
                        Tidak ada foto
                    </div>
                </div>

            </section>

            <!-- Bagian Kanan -->
            <section class="penanganan">

                <!-- Dropdown Status & Tombol Simpan (pakai kode ST1-ST4) -->
                <form class="status-form" 
                      th:action="@{/laporan/update-status/{id}(id=${laporan.id_laporan})}" 
                      method="POST">

                    <select name="status" class="status-select">
                        <option value="ST1" th:selected="${laporan.id_status?.id_status == 'ST1'}">Menunggu Verifikasi</option>
                        <option value="ST2" th:selected="${laporan.id_status?.id_status == 'ST2'}">Terverifikasi / On Progress</option>
                        <option value="ST3" th:selected="${laporan.id_status?.id_status == 'ST3'}">Tidak Terverifikasi</option>
                        <option value="ST4" th:selected="${laporan.id_status?.id_status == 'ST4'}">Selesai</option>
                    </select>

                    <button type="submit" class="btn-simpan">Simpan</button>
                </form>

                <!-- Judul Log Penanganan & Tombol Tambah (aktif jika ST2) -->
                <div class="log-header">
                    <h2>Log Penanganan</h2>
                    <a th:href="${laporan.id_status?.id_status == 'ST2' ? '/penanganan/tambah/' + laporan.id_laporan : '#'}" 
                       class="btn-tambah"
                       th:classappend="${laporan.id_status?.id_status != 'ST2' ? 'disabled' : ''}">
                        Tambah
                    </a>
                </div>

                <!-- Kotak Log Penanganan -->
                <div class="log">

                    <div class="log-info">
                        <div class="label">Jumlah Personel</div>
                        <div>
                            <span th:text="${penanganan?.jumlah_personel ?: '-'}">-</span>
                            <span th:if="${penanganan?.jumlah_personel != null}"> orang</span>
                        </div>

                        <div class="label">Tanggal</div>
                        <div th:text="${penanganan?.tanggal_penanganan != null ? #temporals.format(penanganan.tanggal_penanganan, 'dd MMMM yyyy') : '-'}">-</div>

                        <div class="label">Aktivitas</div>
                        <div th:text="${penanganan?.aktivitas ?: '-'}">-</div>
                    </div>

                    <div class="foto-penanganan">
                        <p>Foto Penanganan</p>
                        <img th:if="${penanganan != null and penanganan.foto_penanganan != null}" 
                             th:src="@{/penanganan/foto/{id}(id=${penanganan.id_log})}"
                             alt="Foto Penanganan">
                        <div th:if="${penanganan == null or penanganan.foto_penanganan == null}" class="empty-img-box-dark">
                            Tidak ada foto
                        </div>
                    </div>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
