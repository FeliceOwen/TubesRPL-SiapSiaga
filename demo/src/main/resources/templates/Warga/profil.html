<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Profil | SiapSiaga</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: 'Inter', sans-serif;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            header {
                background-color: #626F47;
                color: #F5ECD5;
                margin: 0;
                padding: 10px;
                font-weight: bold;
                font-size: 40px;
                position: sticky;
                top: 0;
            }

            main {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px 20px 90px;
            }

            main > img {
                width: 110px;
                margin-bottom: 25px;
            }

            #role {
                margin: 0 0 25px;
                font-size: 24px;
                font-weight: 800;
                color: #626F47;
            }

            #biodata {
                display: flex;
                flex-direction: column;
                gap: 14px;
                width: 100%;
                max-width: 340px;
                box-sizing: border-box;
                background-color: #626F47;
                border-radius: 10px;
                padding: 20px;
                color: white;
            }

            #biodata label {
                display: block;
                font-size: 13px;
                font-weight: bold;
                color: #F5ECD5;
                margin-bottom: 2px;
            }

            #biodata p {
                margin: 0;
                font-size: 18px;
                font-weight: 600;
                word-break: break-word;
            }

            #logout {
                margin-top: 25px;
                padding: 10px 40px;
                border-radius: 10px;
                background-color: #F5ECD5;
                color: #626F47;
                border: 2px solid #626F47;
                font-weight: bold;
                font-size: 16px;
                text-decoration: none;
            }

            nav {
                background-color: #F5ECD5;
                display: flex;
                justify-content: space-evenly;
                position: fixed;
                align-items: center;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 10px;
                box-sizing: border-box;
                height: 60px;
            }
        </style>
    </head>
    <body>
        <header>SiapSiaga</header>
        <main>
            <img src="../assets/profile-black.png" th:src="@{/assets/profile-black.png}" alt="Profil">
            <h1 id="role" th:text="${role}">Warga</h1>
            <div id="biodata">
                <div>
                    <label>NIK</label>
                    <p th:text="${nik}">NIK Warga</p>
                </div>
                <div>
                    <label>Nama</label>
                    <p th:text="${nama}">Nama Warga</p>
                </div>
            </div>
            <a id="logout" href="#" th:href="@{/logout}">Logout</a>
        </main>

        <nav>
            <a href="index.html" th:href="@{/warga/}">
                <img src="../assets/home-black.png" th:src="@{/assets/home-black.png}" value="dashboard">
            </a>
            <a href="laporan.html">
                <img src="../assets/report-black.png" th:src="@{/assets/report-black.png}" value="laporan">
            </a>
            <a href="profil.html" th:href="@{/profil}">
                <img src="../assets/profile-green.png" th:src="@{/assets/profile-green.png}" value="profil">
            </a>
        </nav>
    </body>
</html>
