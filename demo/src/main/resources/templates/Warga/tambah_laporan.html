<!DOCTYPE html>
<html>
    <head>
        <title>Instruksi Buat Laporan</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <script>
            document.addEventListener("DOMContentLoaded", function() {
            const WILAYAH_API = "https://www.emsifa.com/api-wilayah-indonesia/v2";
            const SEKOLAH_API = "https://api-sekolah-indonesia.vercel.app/sekolah";
            const SEKOLAH_BRIDGE = "https://sekolah.devapi.id/sekolah";

            const provinsi = document.getElementById("provinsi-kejadian");
            const kabkot = document.getElementById("kabkot-kejadian");
            const kecamatan = document.getElementById("kecamatan-kejadian");
            const kelurahan = document.getElementById("kelurahan-kejadian");
            const sekolah = document.getElementById("sekolah-kejadian");
            const pilihBencana = document.getElementById("pilih-bencana");

            function setOptions(select, items, placeholder) {
                select.innerHTML = "";
                const first = document.createElement("option");
                first.value = "";
                first.textContent = placeholder;
                select.appendChild(first);
                items.forEach(function(item) {
                    const opt = document.createElement("option");
                    opt.value = item.id;
                    opt.textContent = item.name;
                    select.appendChild(opt);
                });
            }

            function setDisabled(select, disabled) {
                select.disabled = disabled;
            }

            function resetBelow(selects) {
                selects.forEach(function(s) {
                    setOptions(s, [], "Pilih " + s.dataset.label);
                    setDisabled(s, true);
                });
            }

            async function fetchWilayah(path, select, placeholder) {
                setDisabled(select, true);
                try {
                    const res = await fetch(WILAYAH_API + path);
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const json = await res.json();
                    setOptions(select, json.data || [], placeholder);
                    setDisabled(select, false);
                } catch (err) {
                    setOptions(select, [], "Gagal memuat data");
                    console.error("Gagal memuat wilayah:", path, err);
                }
            }

            provinsi.addEventListener("change", function() {
                resetBelow([kabkot, kecamatan, kelurahan]);
                if (this.value === "") return;
                fetchWilayah("/regencies/" + this.value + ".json", kabkot, "Pilih Kabupaten / Kota");
            });

            kabkot.addEventListener("change", function() {
                resetBelow([kecamatan, kelurahan]);
                if (this.value === "") return;
                fetchWilayah("/districts/" + this.value + ".json", kecamatan, "Pilih Kecamatan");
            });

            let sekolahCache = { kode: null, list: [] };
            let kecCodeCache = {};

            async function resolveKodeKec() {
                const key = kecamatan.value;
                if (key === "") return null;
                if (key in kecCodeCache) return kecCodeCache[key];

                const kodeKemendagri = key.replace(/\./g, "");
                let hasil = null;
                try {
                    const jenjang = ["SD", "SMP", "SMA", "SMK"];
                    cari:
                    for (const b of jenjang) {
                        const res = await fetch(SEKOLAH_BRIDGE + "?kode_wilayah=" + kodeKemendagri +
                            "&bentuk_pendidikan=" + b + "&limit=5");
                        const json = await res.json();
                        for (const s of (json.data || [])) {
                            const r2 = await fetch(SEKOLAH_API + "?npsn=" + s.npsn);
                            const j2 = await r2.json();
                            if (j2.total_data > 0 && j2.dataSekolah[0].kode_kec) {
                                hasil = j2.dataSekolah[0].kode_kec.trim();
                                break cari;
                            }
                        }
                    }
                } catch (err) {
                    console.error("Gagal resolve kode kecamatan:", err);
                }
                kecCodeCache[key] = hasil;
                return hasil;
            }

            async function updateSekolah() {
                const aktif = pilihBencana.value === "B06" && kecamatan.value !== "";
                if (!aktif) {
                    sekolahCache = { kode: null, list: [] };
                    setOptions(sekolah, [], "Pilih Sekolah");
                    setDisabled(sekolah, true);
                    return;
                }

                setDisabled(sekolah, true);
                try {
                    const kode = await resolveKodeKec();
                    if (!kode) {
                        setOptions(sekolah, [], "Data sekolah tidak tersedia");
                        return;
                    }

                    if (sekolahCache.kode !== kode) {
                        let semua = [];
                        for (let page = 1; page <= 3; page++) {
                            const res = await fetch(SEKOLAH_API + "?kec=" + kode + "&page=" + page + "&perPage=100");
                            if (!res.ok) throw new Error("HTTP " + res.status);
                            const json = await res.json();
                            semua = semua.concat(json.dataSekolah || []);
                            if (semua.length >= (json.total_data || 0)) break;
                        }
                        sekolahCache = { kode: kode, list: semua };
                    }

                    const list = sekolahCache.list;
                    if (list.length === 0) {
                        setOptions(sekolah, [], "Tidak ada sekolah di wilayah ini");
                    } else {
                        setOptions(sekolah, list.map(function(s) {
                            return { id: s.npsn, name: s.sekolah + " (" + s.bentuk + ")" };
                        }), "Pilih Sekolah");
                    }
                    setDisabled(sekolah, false);
                } catch (err) {
                    setOptions(sekolah, [], "Gagal memuat data sekolah");
                    console.error("Gagal memuat sekolah:", err);
                }
            }

            kecamatan.addEventListener("change", function() {
                resetBelow([kelurahan]);
                sekolahCache = { kode: null, list: [] };
                updateSekolah();
                if (this.value === "") return;
                fetchWilayah("/villages/" + this.value + ".json", kelurahan, "Pilih Kelurahan");
            });

            kelurahan.addEventListener("change", function() {
                updateSekolah();
            });

            pilihBencana.addEventListener("change", function() {
                updateSekolah();
            });

            fetchWilayah("/provinces.json", provinsi, "Pilih Provinsi");
            });
        </script>
        <style>
            * {
                font-family: 'Inter', sans-serif;
            }

            body {
                overflow-x: hidden;
                margin: 20px;
                header {
                    display: flex;
                    a {
                        margin-top: 5px;
                    }
                    h1 {
                        margin: 0;
                        margin-left: 10px;
                        font-weight: bold;
                        font-size: 25px;
                    }
                    margin-bottom: 20px;
                }
                main {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    form {
                        display: flex;
                        flex-direction: column;
                        width: 100%;
                    }
                    #input-laporan {
                        background-color: #F5ECD5;
                        border-radius: 10px;
                        padding: 10px;
                        padding-top: 1px;
                        box-sizing: border-box;
                    }
                    #submit-laporan {
                        position: fixed;
                        bottom: 15px;
                        left: 50%;
                        transform: translateX(-50%);
                        width: calc(100% - 40px);
                        max-width: 500px;

                        font-size: 25px;
                        background-color: #626F47;
                        padding: 20px;
                        border-radius: 15px;
                        font-weight: bold;

                        box-sizing: border-box;
                        text-align: center;
                        text-decoration: none;
                        color: white;
                    }
                }
                div#bencana, div#lokasi {
                    span{
                        display: flex;
                        margin-bottom: 10px;
                        justify-content: space-between;
                    }
                    #foto-kejadian {
                        max-width: 220px;
                        margin-right: 0;
                    }
                }
                span#alamat-bencana {
                    textarea {
                        width: 50%;
                        box-sizing: border-box;
                        height : 50px;
                    }
                }
                div#catatan {
                    textarea {
                        width :100%;
                        box-sizing: border-box;
                        height: 125px;
                    }
                }

            }
        </style>
    </head>
    <body>
        <header>
            <a th:href="@{/warga/instruksi/}">
                <img th:src="@{/assets/back-black.png}" value="back">
            </a>
            <h1>Buat Laporan Bencana</h1>
        </header>
        <main>
            <form method="post" th:action="@{/warga/laporan/}" th:object="${laporanBencana}" enctype="multipart/form-data">
                <div id="input-laporan">
                    <div id="bencana">
                        <h2>Bencana</h2>
                        <span id="jenis-bencana">
                            <label for="pilih-bencana">Jenis Bencana</label>
                            <select id="pilih-bencana" name="id_bencana" required>
                                <option value="">Pilih Jenis Bencana</option>
                                <option th:each="data : ${daftarBencana}" th:text="${data.nama_bencana}" th:value="${data.id_bencana}"></option>
                            </select>
                        </span>
                        <span id="tanggal-bencana">
                            <label>Tanggal Kejadian</label>
                            <input type="date" th:field="*{tanggalKejadian}" required>
                        </span>
                        <span id="waktu-bencana">
                            <label>Waktu Kejadian</label>
                            <input type="time" th:field="*{jamKejadian}" required>
                        </span>
                        <span id="foto-bencana">
                            <label>Foto Kejadian</label>
                            <input type="file" accept="image/jpeg, image/png" name="fotofile" required>
                        </span>
                    </div>

                    <div id="lokasi">
                        <h2>Lokasi</h2>
                        <span id="provinsi-bencana">
                            <label for="provinsi-kejadian">Provinsi</label>
                            <select id="provinsi-kejadian" name="provinsi-bencana" required>
                            </select>
                        </span>
                        <span id="kabkot-bencana">
                            <label for="kabkot-kejadian">Kabupaten / Kota</label>
                            <select id="kabkot-kejadian" name="kabkot-bencana" data-label="Kabupaten / Kota" disabled required>
                            </select>
                        </span>
                        <span id="kecamatan-bencana">
                            <label for="kecamatan-kejadian">Kecamatan</label>
                            <select id="kecamatan-kejadian" name="kecamatan-bencana" data-label="Kecamatan" disabled required>
                            </select>
                        </span>
                        <span id="kelurahan-bencana">
                            <label for="kelurahan-bencana">Kelurahan</label>
                            <select id="kelurahan-kejadian" name="id_kel" disabled required>
                            </select>
                        </span>
                        <span id="sekolah-bencana">
                            <label for="sekolah-kejadian">Sekolah</label>
                            <select id="sekolah-kejadian" name="id_sekolah" disabled>
                            </select>
                        </span>
                        <span id="alamat-bencana">
                            <label for="alamat-bencana">Alamat</label>
                            <textarea placeholder="Isi alamat (nama jalan dan nomor)" th:field="*{alamat}" required></textarea>
                        </span>
                    </div>

                    <div id="catatan">
                        <h2>Catatan</h2>
                        <textarea th:field="*{catatan}" placeholder="Tambah catatan kejadian di sini" required></textarea>
                    </div>
                </div>
                <button id="submit-laporan">
                    Buat Laporan
                </button>
            </form>
        </main>
        
    </body>
</html>
